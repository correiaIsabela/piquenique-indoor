<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piquenique Indoor 🧺✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #fdf8f5;
      --gingham-tint: rgba(217, 78, 52, 0.055);
      --surface: #ffffff;
      --surface-soft: #faf5f0;
      --border: #eadcd3;
      --text-main: #2d2420;
      --text-muted: #786860;
      --accent: #d94e34;
      --accent-hover: #bf3f27;
      --accent-soft: #fcebe8;
      --green: #2e7d52;
      --green-soft: #e6f4ec;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --shadow-sm: 0 2px 8px rgba(45, 36, 32, 0.04);
      --shadow-md: 0 8px 24px rgba(45, 36, 32, 0.07);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image:
        linear-gradient(90deg, var(--gingham-tint) 50%, transparent 50%),
        linear-gradient(var(--gingham-tint) 50%, transparent 50%);
      background-size: 36px 36px;
      min-height: 100vh;
      line-height: 1.5;
      padding: 24px 16px 64px;
    }

    h1, h2, h3, .font-serif {
      font-family: 'Fraunces', Georgia, serif;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .status-pill.online {
      color: var(--green);
      border-color: #bfe3ce;
      background: var(--green-soft);
    }
    .status-pill.online .status-dot {
      background: var(--green);
    }

    .status-pill.offline {
      color: var(--amber);
      border-color: #fde68a;
      background: var(--amber-soft);
    }
    .status-pill.offline .status-dot {
      background: var(--amber);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Summary & Share Bar */
    .summary-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }

    .summary-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .basket-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--green-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .summary-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .summary-count {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-share:hover {
      background: #f2e8e0;
    }

    /* Form Card */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .plus-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .form-header h2 {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .form-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Category Grid */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      background: var(--surface-soft);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-btn:hover {
      border-color: #d3bfb2;
      background: #f5ede6;
    }

    .cat-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-hover);
      box-shadow: 0 2px 8px rgba(217, 78, 52, 0.14);
    }

    .cat-btn-emoji {
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Inputs */
    .inputs-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      .inputs-row {
        grid-template-columns: 1fr;
      }
      .summary-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-share {
        width: 100%;
      }
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    input[type="text"]:focus {
      background: var(--surface);
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(217, 78, 52, 0.22);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Categories Board */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .cat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cat-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .cat-card-title h3 {
      font-size: 17px;
      line-height: 1.2;
    }

    .count-pill {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .items-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      margin-bottom: 14px;
    }

    .empty-box {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 22px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .item-row {
      background: var(--surface-soft);
      border: 1px solid #efe4dd;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-text {
      min-width: 0;
    }

    .item-food {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
      word-break: break-word;
    }

    .item-person {
      font-size: 12px;
      color: var(--text-muted);
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: #e9ddd5;
      color: var(--text-main);
    }

    .icon-btn.delete:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .btn-quick-add {
      width: 100%;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-quick-add:hover {
      background: #efe5de;
    }

    /* Edit inline */
    .edit-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .edit-box input {
      padding: 8px 10px;
      font-size: 14px;
      background: #ffffff;
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .btn-mini {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #ffffff;
      font-family: inherit;
    }

    .btn-mini.save {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2d2420;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div id="status-pill" class="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">A ligar à cesta...</span>
      </div>
      <h1>Piquenique Indoor 🧺✨</h1>
      <p class="subtitle">
        Vê o que os outros já vão levar para evitar coisas repetidas e adiciona o teu contributo à nossa cesta!
      </p>
    </header>

    <div class="summary-bar">
      <div class="summary-info">
        <div class="basket-badge">🧺</div>
        <div>
          <div class="summary-label">Na nossa cesta</div>
          <div id="total-count" class="summary-count">0 itens registados</div>
        </div>
      </div>
      <button type="button" id="share-btn" class="btn-share">
        <span>🔗</span>
        <span>Copiar link do piquenique</span>
      </button>
    </div>

    <section class="form-card">
      <div class="form-header">
        <div class="plus-badge">+</div>
        <div>
          <h2>Adicionar à nossa cesta</h2>
          <p>Coisas simples e económicas — vê primeiro o que já está na lista abaixo!</p>
        </div>
      </div>

      <form id="add-form">
        <label class="field-label">1. Escolhe a categoria</label>
        <div id="category-buttons" class="category-grid"></div>

        <div class="inputs-row">
          <div>
            <label for="person-name" class="field-label">2. O teu nome</label>
            <input type="text" id="person-name" placeholder="Ex: Joana" required maxlength="40">
          </div>
          <div>
            <label for="food-item" class="field-label">3. O que vais levar?</label>
            <input type="text" id="food-item" placeholder="Ex: Pipocas doces e batatas" required maxlength="80">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          <span>🧺</span>
          <span id="submit-text">Adicionar à cesta</span>
        </button>
      </form>
    </section>

    <main id="board-grid" class="board-grid"></main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const CATEGORIES = [
      { id: 'salgados', name: 'Salgados de pacote', emoji: '🥨', bg: '#fef3c7' },
      { id: 'comida', name: 'Comida / Sandes', emoji: '🥪', bg: '#ffedd5' },
      { id: 'fruta', name: 'Fruta / Fresco', emoji: '🍓', bg: '#dcfce7' },
      { id: 'doces', name: 'Doces', emoji: '🍪', bg: '#fce7f3' },
      { id: 'bebidas', name: 'Bebidas', emoji: '🥤', bg: '#e0f2fe' }
    ];

    const DB_ENDPOINTS = [
      'https://piquenique-indoor-default-rtdb.firebaseio.com/cesta.json',
      'https://piquenique-indoor-default-rtdb.europe-west1.firebasedatabase.app/cesta.json'
    ];
    let activeEndpoint = DB_ENDPOINTS[0];

    let items = [];
    let selectedCategory = 'salgados';
    let editingId = null;
    let isSyncing = false;

    const statusPill = document.getElementById('status-pill');
    const statusText = document.getElementById('status-text');
    const totalCountEl = document.getElementById('total-count');
    const categoryButtonsEl = document.getElementById('category-buttons');
    const boardGridEl = document.getElementById('board-grid');
    const addForm = document.getElementById('add-form');
    const personInput = document.getElementById('person-name');
    const foodInput = document.getElementById('food-item');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const shareBtn = document.getElementById('share-btn');
    const toastEl = document.getElementById('toast');

    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => {
        toastEl.className = 'toast';
      }, 3200);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function setStatus(state, text) {
      statusPill.className = 'status-pill ' + state;
      statusText.textContent = text;
    }

    function renderCategoryButtons() {
      categoryButtonsEl.innerHTML = CATEGORIES.map(cat => `
        <button type="button"
                class="cat-btn ${selectedCategory === cat.id ? 'selected' : ''}"
                data-cat="${cat.id}">
          <span class="cat-btn-emoji">${cat.emoji}</span>
          <span>${cat.name}</span>
        </button>
      `).join('');

      categoryButtonsEl.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedCategory = btn.dataset.cat;
          renderCategoryButtons();
        });
      });
    }

    function renderBoard() {
      totalCountEl.textContent = `${items.length} ${items.length === 1 ? 'item registado' : 'itens registados'}`;

      boardGridEl.innerHTML = CATEGORIES.map(cat => {
        const catItems = items.filter(i => i.category === cat.id);

        const listHtml = catItems.length === 0
          ? `<div class="empty-box">Ainda ninguém escolheu esta categoria.<br>Sê o primeiro!</div>`
          : `<ul class="items-list">
              ${catItems.map(item => {
                if (editingId === item.id) {
                  return `
                    <li class="item-row">
                      <div class="edit-box">
                        <input type="text" id="edit-name-${item.id}" value="${escapeHtml(item.name)}" placeholder="Nome" maxlength="40">
                        <input type="text" id="edit-food-${item.id}" value="${escapeHtml(item.food)}" placeholder="O que vai levar" maxlength="80">
                        <div class="edit-actions">
                          <button type="button" class="btn-mini" onclick="cancelEdit()">Cancelar</button>
                          <button type="button" class="btn-mini save" onclick="saveEdit('${item.id}')">Guardar</button>
                        </div>
                      </div>
                    </li>
                  `;
                }
                return `
                  <li class="item-row">
                    <div class="item-text">
                      <div class="item-food">${escapeHtml(item.food)}</div>
                      <div class="item-person">por ${escapeHtml(item.name)}</div>
                    </div>
                    <div class="item-actions">
                      <button type="button" class="icon-btn" title="Editar" onclick="startEdit('${item.id}')">✏️</button>
                      <button type="button" class="icon-btn delete" title="Remover" onclick="removeItem('${item.id}')">🗑️</button>
                    </div>
                  </li>
                `;
              }).join('')}
            </ul>`;

        return `
          <article class="cat-card">
            <div class="cat-card-header">
              <div class="cat-card-title">
                <div class="cat-icon-box" style="background:${cat.bg}">${cat.emoji}</div>
                <h3>${cat.name}</h3>
              </div>
              <span class="count-pill">${catItems.length} ${catItems.length === 1 ? 'item' : 'itens'}</span>
            </div>
            ${listHtml}
            <button type="button" class="btn-quick-add" onclick="quickSelect('${cat.id}')">
              + Adicionar a ${cat.name}
            </button>
          </article>
        `;
      }).join('');
    }

    window.quickSelect = function(catId) {
      selectedCategory = catId;
      renderCategoryButtons();
      addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => {
        if (!personInput.value.trim()) personInput.focus();
        else foodInput.focus();
      }, 300);
    };

    window.startEdit = function(id) {
      editingId = id;
      renderBoard();
    };

    window.cancelEdit = function() {
      editingId = null;
      renderBoard();
    };

    window.saveEdit = async function(id) {
      const newName = document.getElementById(`edit-name-${id}`)?.value.trim();
      const newFood = document.getElementById(`edit-food-${id}`)?.value.trim();
      if (!newName || !newFood) {
        showToast('Preenche o nome e o item!', true);
        return;
      }
      isSyncing = true;
      try {
        await fetchFromFirebase();
        items = items.map(item => item.id === id ? { ...item, name: newName, food: newFood } : item);
        editingId = null;
        renderBoard();
        await saveToFirebase();
        showToast('Item atualizado!');
      } finally {
        isSyncing = false;
      }
    };

    window.removeItem = async function(id) {
      isSyncing = true;
      try {
        await fetchFromFirebase();
        items = items.filter(item => item.id !== id);
        if (editingId === id) editingId = null;
        renderBoard();
        await saveToFirebase();
        showToast('Item removido da cesta.');
      } finally {
        isSyncing = false;
      }
    };

    async function fetchFromFirebase() {
      for (const url of [activeEndpoint, ...DB_ENDPOINTS.filter(u => u !== activeEndpoint)]) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          activeEndpoint = url;
          const data = await res.json();
          const list = Array.isArray(data) ? data.filter(Boolean) : (data ? Object.values(data) : []);
          const changed = JSON.stringify(list) !== JSON.stringify(items);
          items = list;
          if (changed && !editingId) renderBoard();
          setStatus('online', 'Cesta partilhada ativa');
          return true;
        } catch (err) {}
      }
      setStatus('offline', 'Erro de ligação ao Firebase');
      return false;
    }

    async function saveToFirebase() {
      try {
        const res = await fetch(activeEndpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(items)
        });
        if (!res.ok) throw new Error('Falha ao gravar');
        setStatus('online', 'Cesta partilhada ativa');
      } catch (err) {
        setStatus('offline', 'Sem permissão de escrita');
        showToast('Erro ao guardar — verifica se o modo de teste está ativo no Firebase.', true);
      }
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = personInput.value.trim();
      const food = foodInput.value.trim();
      if (!name || !food) return;

      submitBtn.disabled = true;
      submitText.textContent = 'A guardar...';
      isSyncing = true;

      try {
        await fetchFromFirebase();
        items.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          category: selectedCategory,
          name,
          food
        });
        foodInput.value = '';
        renderBoard();
        await saveToFirebase();
        showToast('Adicionado à cesta! 🧺');
      } finally {
        isSyncing = false;
        submitBtn.disabled = false;
        submitText.textContent = 'Adicionar à cesta';
      }
    });

    shareBtn.addEventListener('click', async () => {
      const cleanUrl = window.location.origin + window.location.pathname;
      try {
        await navigator.clipboard.writeText(cleanUrl);
        showToast('Link copiado! Cola no grupo do WhatsApp.');
      } catch (err) {
        const temp = document.createElement('input');
        temp.value = cleanUrl;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast('Link copiado! Cola no grupo do WhatsApp.');
      }
    });

    renderCategoryButtons();
    renderBoard();
    fetchFromFirebase();
    setInterval(() => {
      if (!editingId && !isSyncing) {
        fetchFromFirebase();
      }
    }, 3000);
  </script>
</body>
</html>
